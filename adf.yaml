apiVersion: v1\nkind: Namespace\nmetadata:\n  name: {{NAMESPACE}}\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: {{PROJECT_NAME}}-config\n  namespace: {{NAMESPACE}}\ndata:\n  APP_ENV: "pro"\n  TZ: "Asia/Shanghai"\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: {{PROJECT_NAME}}-deployment\n  namespace: {{NAMESPACE}}\n  labels:\n    app: {{PROJECT_NAME}}\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: {{PROJECT_NAME}}\n  template:\n    metadata:\n      labels:\n        app: {{PROJECT_NAME}}\n    spec:\n      containers:\n      - name: {{PROJECT_NAME}}\n        image: 192.168.192.90:80/zebra/simple-python-pyinstaller-app:latest\n        imagePullPolicy: Always\n        ports:\n        - containerPort: 5000\n          name: http\n        envFrom:\n        - configMapRef:\n            name: {{PROJECT_NAME}}-config\n        resources:\n          requests:\n            memory: "128Mi"\n            cpu: "100m"\n          limits:\n            memory: "256Mi"\n            cpu: "200m"\n        livenessProbe:\n          httpGet:\n            path: /\n            port: 5000\n          initialDelaySeconds: 30\n          periodSeconds: 10\n        readinessProbe:\n          httpGet:\n            path: /\n            port: 5000\n          initialDelaySeconds: 5\n          periodSeconds: 5\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: {{PROJECT_NAME}}-svc\n  namespace: {{NAMESPACE}}\n  labels:\n    app: {{PROJECT_NAME}}\nspec:\n  selector:\n    app: {{PROJECT_NAME}}\n  ports:\n    - protocol: TCP\n      port: 80\n      targetPort: 5000\n      name: http\n  type: ClusterIP